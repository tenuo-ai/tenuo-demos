[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenuo-hermes-incident-demo"
version = "0.1.0"
description = "A Hermes on-call agent, a poisoned log, and authority bounded by the incident"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tenuo>=0.3.2,<0.4",
  # The delegation-plan feature is in hermes-tenuo PRs #27-#29. Until merged, install
  # the branch alongside this package (see LIVE.md); pin it here once released:
  #   "hermes-tenuo>=0.1.4",
  "pyyaml>=6,<7",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
hermes-incident = "hermes_incident.cli:main"
# The shims the simulated agent's terminal runs (lab PATH only).
kubectl = "hermes_incident.cli:kubectl_main"
proddb = "hermes_incident.cli:proddb_main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_incident"]

[tool.pytest.ini_options]
testpaths = ["tests"]
