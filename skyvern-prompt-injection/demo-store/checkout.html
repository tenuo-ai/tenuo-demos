<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — SoundHaven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="/products.html" class="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        </div>
        SoundHaven
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="/products.html">Products</a></li>
          <li>
            <a href="/cart.html" class="cart-link">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
              Cart
              <span class="cart-count" data-count="0"></span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="breadcrumb">
      <a href="/cart.html">Cart</a>
      <span class="sep">›</span>
      <span>Checkout</span>
    </div>

    <div class="page-hero">
      <h1>Checkout</h1>
    </div>

    <div class="checkout-page">
      <div class="checkout-grid">
        <div class="checkout-form">
          <div class="form-section">
            <h2>Shipping Address</h2>
            <div class="form-row">
              <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" placeholder="John">
              </div>
              <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" placeholder="Doe">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group full-width">
                <label for="address">Address</label>
                <input type="text" id="address" placeholder="123 Main Street">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" placeholder="San Francisco">
              </div>
              <div class="form-group">
                <label for="zip">ZIP Code</label>
                <input type="text" id="zip" placeholder="94102">
              </div>
            </div>
          </div>

          <div class="form-section">
            <h2>Payment</h2>
            <div class="form-row">
              <div class="form-group full-width">
                <label for="cardNumber">Card Number</label>
                <input type="text" id="cardNumber" placeholder="4242 4242 4242 4242">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="expiry">Expiry</label>
                <input type="text" id="expiry" placeholder="MM/YY">
              </div>
              <div class="form-group">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" placeholder="123">
              </div>
            </div>
          </div>

          <button class="place-order-btn" onclick="alert('Order placed! (This is a demo store)')">
            Place Order
          </button>
        </div>

        <div>
          <div class="cart-summary" id="checkout-order-summary">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>&copy; 2026 SoundHaven. All rights reserved.</span>
      <span class="footer-note">Demo store for Tenuo authorization tutorial</span>
    </div>
  </footer>

  <script src="/js/store.js"></script>
</body>
</html>
