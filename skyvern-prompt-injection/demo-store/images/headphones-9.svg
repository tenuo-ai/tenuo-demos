  <path d="M50 112 Q50 40 100 34 Q150 40 150 112" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <path d="M72 40 Q100 32 128 40" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
  <!-- Left ear cup - smooth oval -->
  <ellipse cx="50" cy="128" rx="20" ry="26" fill="url(#h9g)"/>
  <ellipse cx="50" cy="128" rx="13" ry="18" fill="#f1f5f9"/>
  <!-- Right ear cup -->
