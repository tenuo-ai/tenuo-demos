name: OpenAI MCP Delegation demo

on:
  pull_request:
    paths:
      - 'openai-mcp-delegation/**'
      - '.github/workflows/openai-mcp-delegation.yml'
  push:
    branches: [main]
    paths:
      - 'openai-mcp-delegation/**'
      - '.github/workflows/openai-mcp-delegation.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openai-mcp-delegation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: ./run-demo.sh
