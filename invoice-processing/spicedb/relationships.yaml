# SpiceDB relationship tuples for the AP automation demo.
# These establish who can do what to which objects.

relationships:
  # Organization membership
  - resource: "organization:acorp"
    relation: "admin"
    subject: "agent:finance-controller"
  - resource: "organization:acorp"
    relation: "member"
    subject: "agent:invoice-processor"
  - resource: "organization:acorp"
    relation: "member"
    subject: "agent:payment-executor"
  - resource: "organization:acorp"
    relation: "member"
    subject: "agent:expense-reviewer"
  - resource: "organization:acorp"
    relation: "member"
    subject: "agent:vendor-verification"
  - resource: "organization:acorp"
    relation: "member"
    subject: "agent:fx-rate-checker"

  # Invoice processor can process all pending invoices
  - resource: "invoice:INV-2024-1841"
    relation: "processor"
    subject: "agent:invoice-processor"
  - resource: "invoice:INV-2024-1842"
    relation: "processor"
    subject: "agent:invoice-processor"
  - resource: "invoice:INV-2024-1843"
    relation: "processor"
    subject: "agent:invoice-processor"
  - resource: "invoice:INV-2024-1847"
    relation: "processor"
    subject: "agent:invoice-processor"
  - resource: "invoice:INV-2024-1848"
    relation: "processor"
    subject: "agent:invoice-processor"
  - resource: "invoice:INV-2024-1849"
    relation: "processor"
    subject: "agent:invoice-processor"

  # Vendor relationships — editor role for verification workflow
  - resource: "vendor:V-4521"
    relation: "editor"
    subject: "agent:invoice-processor"
  - resource: "vendor:V-4521"
    relation: "editor"
    subject: "agent:vendor-verification"
  - resource: "vendor:V-4522"
    relation: "editor"
    subject: "agent:invoice-processor"
  - resource: "vendor:V-4523"
    relation: "editor"
    subject: "agent:invoice-processor"
  - resource: "vendor:V-4524"
    relation: "editor"
    subject: "agent:invoice-processor"
  - resource: "vendor:V-4526"
    relation: "editor"
    subject: "agent:invoice-processor"

  # Viewer relationships for vendor verification agent
  - resource: "vendor:V-4521"
    relation: "viewer"
    subject: "agent:vendor-verification"
  - resource: "vendor:V-4522"
    relation: "viewer"
    subject: "agent:vendor-verification"

  # Payment executor relationships
  - resource: "payment:*"
    relation: "executor"
    subject: "agent:payment-executor"

  # PO reader relationships
  - resource: "purchase_order:PO-2024-0891"
    relation: "viewer"
    subject: "agent:invoice-processor"
  - resource: "purchase_order:PO-2024-0892"
    relation: "viewer"
    subject: "agent:invoice-processor"
  - resource: "purchase_order:PO-2024-0893"
    relation: "viewer"
    subject: "agent:invoice-processor"
